# Local Jenkins for trying the Jenkinsfiles in this repo.
#   docker compose -f jenkins/docker-compose.yml up -d --build
# Then open http://localhost:8080
services:
  jenkins:
    build: .
    container_name: jenkins
    # Runs as root so it can use the host's Docker socket without sorting out group ids.
    # Fine on a personal laptop; don't do this on a shared server.
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:

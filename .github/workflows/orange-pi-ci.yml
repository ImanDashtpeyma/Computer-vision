name: Orange Pi object detection CI

on:
  push:
    branches: [main]
    paths:
      - "orange-pi-object-detection/**"
      - ".github/workflows/orange-pi-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "orange-pi-object-detection/**"
      - ".github/workflows/orange-pi-ci.yml"

defaults:
  run:
    working-directory: orange-pi-object-detection

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: orange-pi-object-detection/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t orange-pi-object-detection:ci .
